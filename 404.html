<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050507">
  <meta name="robots" content="noindex, follow">
  <title>404 — Page Not Found | Phuah Hong Xuan (Gary)</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48x48.png">
  <link rel="icon" type="image/png" sizes="96x96" href="/assets/favicon-96x96.png">
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050507;
      --card-bg: rgba(18, 19, 26, 0.75);
      --purple: #8b5cf6;
      --purple-light: #a78bfa;
      --text: #ffffff;
      --text-muted: #94a3b8;
      --border: rgba(139, 92, 246, 0.28);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: clip;
      position: relative;
    }
    .ambient-orb {
      position: absolute;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.18) 0%, rgba(5, 5, 7, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }
    .orb-top {
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
    }
    .container {
      position: relative;
      z-index: 1;
      max-width: 540px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 48px 36px;
      text-align: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6), 0 0 32px rgba(139, 92, 246, 0.12);
    }
    .brand-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px auto;
      display: block;
      filter: drop-shadow(0 0 16px rgba(139, 92, 246, 0.5));
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .brand-logo:hover {
      transform: scale(1.08) rotate(4deg);
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--purple-light);
      background: rgba(139, 92, 246, 0.12);
      border: 1px solid rgba(139, 92, 246, 0.3);
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 20px;
    }
    .error-code {
      font-family: 'Anton', sans-serif;
      font-size: clamp(84px, 18vw, 120px);
      line-height: 0.95;
      letter-spacing: 0.02em;
      background: linear-gradient(180deg, #ffffff 30%, rgba(167, 139, 250, 0.7) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }
    .title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #f8fafc;
    }
    .desc {
      font-size: 15px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #8b5cf6 0%, #7c3aed 100%);
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 8px 24px rgba(139, 92, 246, 0.35);
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(139, 92, 246, 0.5);
      background: linear-gradient(135deg, #9b6bf7 0%, #8b5cf6 100%);
    }
    .btn-home:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="ambient-orb orb-top" aria-hidden="true"></div>
  <div class="container">
    <a href="/" title="Phuah Hong Xuan Portfolio">
      <img class="brand-logo" src="assets/logo-192.png?v=20261121_avatar" alt="Gary Logo" width="64" height="64">
    </a>
    <div class="badge">Error 404</div>
    <h1 class="error-code">404</h1>
    <h2 class="title">Page Lost in Orbit</h2>
    <p class="desc">The requested URL doesn't exist on this domain or has been relocated. Return to the main portfolio to explore data analytics projects and verified credentials.</p>
    <a class="btn-home" href="/">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Back to Portfolio
    </a>
  </div>
</body>
</html>
