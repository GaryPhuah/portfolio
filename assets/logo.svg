<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Purple Glow Filter -->
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Border Gradient -->
    <linearGradient id="purpleBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>

  <!-- Outer Ambient Glow -->
  <rect x="40" y="40" width="432" height="432" rx="104" ry="104" fill="#8B5CF6" opacity="0.35" filter="url(#purpleGlow)" />

  <!-- Outer Rounded Squircle with Violet Border -->
  <rect x="44" y="44" width="424" height="424" rx="100" ry="100" fill="#0C0D12" stroke="url(#purpleBorder)" stroke-width="16" />

  <!-- Inner Subtle Metallic Bevel -->
  <rect x="54" y="54" width="404" height="404" rx="90" ry="90" fill="none" stroke="#A78BFA" stroke-width="2" opacity="0.3" />

  <!-- Bold White 'G' -->
  <text x="256" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="280" font-weight="800" fill="#FFFFFF" text-anchor="middle">G</text>
</svg>
